<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4c2" />
      <stop offset="25%" stop-color="#f0cb69" />
      <stop offset="50%" stop-color="#d99f36" />
      <stop offset="75%" stop-color="#fced9d" />
      <stop offset="100%" stop-color="#9e6e18" />
    </linearGradient>

    <linearGradient id="goldBevel" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#734d0b" />
      <stop offset="30%" stop-color="#d9a33b" />
      <stop offset="50%" stop-color="#fff8d6" />
      <stop offset="70%" stop-color="#c98d28" />
      <stop offset="100%" stop-color="#593b05" />
    </linearGradient>

    <radialGradient id="goldRadial" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff5c7" />
      <stop offset="40%" stop-color="#e3b448" />
      <stop offset="85%" stop-color="#996a12" />
      <stop offset="100%" stop-color="#5c3f08" />
    </radialGradient>

    <!-- Deep Crimson Brocade Texture -->
    <radialGradient id="rubyGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#780d24" />
      <stop offset="60%" stop-color="#4d0614" />
      <stop offset="100%" stop-color="#240207" />
    </radialGradient>

    <pattern id="damaskWeave" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 20 0 C 15 10, 5 15, 0 20 C 5 25, 15 30, 20 40 C 25 30, 35 25, 40 20 C 35 15, 25 10, 20 0 Z" fill="none" stroke="#9e1936" stroke-width="0.7" opacity="0.35" />
      <circle cx="20" cy="20" r="3" fill="#dfb15b" opacity="0.25" />
      <circle cx="0" cy="0" r="1.5" fill="#dfb15b" opacity="0.3" />
      <circle cx="40" cy="0" r="1.5" fill="#dfb15b" opacity="0.3" />
      <circle cx="0" cy="40" r="1.5" fill="#dfb15b" opacity="0.3" />
      <circle cx="40" cy="40" r="1.5" fill="#dfb15b" opacity="0.3" />
    </pattern>

    <!-- Drop Shadows -->
    <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.8" />
    </filter>
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Outer Background -->
  <circle cx="300" cy="300" r="290" fill="#0d0407" />
  <circle cx="300" cy="300" r="288" fill="none" stroke="url(#goldBevel)" stroke-width="1.5" opacity="0.4" />

  <!-- ============================================== -->
  <!-- 1. TOP ROYAL IMPERIAL CROWN                     -->
  <!-- ============================================== -->
  <g id="crown" filter="url(#shadow3d)">
    <!-- Crown Base Band -->
    <path d="M 240 100 Q 300 110 360 100 L 362 108 Q 300 118 238 108 Z" fill="url(#goldBevel)" />
    <!-- Crown Band Jewels -->
    <circle cx="260" cy="106" r="2.5" fill="#fff8d6" />
    <circle cx="280" cy="107.5" r="2.5" fill="#9e1936" />
    <circle cx="300" cy="108" r="3" fill="#fff8d6" />
    <circle cx="320" cy="107.5" r="2.5" fill="#9e1936" />
    <circle cx="340" cy="106" r="2.5" fill="#fff8d6" />

    <!-- Crown Peaks / Fleur-de-lis Arches -->
    <!-- Center Peak -->
    <path d="M 292 100 C 290 80, 282 62, 300 38 C 318 62, 310 80, 308 100 Z" fill="url(#goldLight)" />
    <circle cx="300" cy="36" r="4.5" fill="url(#goldBevel)" />
    <circle cx="300" cy="36" r="2" fill="#ffffff" />
    <path d="M 300 48 Q 295 65 300 80 Q 305 65 300 48" fill="#7a4f08" opacity="0.3" />

    <!-- Left Inner Peak -->
    <path d="M 268 100 C 265 82, 255 70, 268 52 C 278 70, 276 82, 280 100 Z" fill="url(#goldBevel)" />
    <circle cx="268" cy="50" r="3.5" fill="url(#goldLight)" />

    <!-- Right Inner Peak -->
    <path d="M 320 100 C 324 82, 322 70, 332 52 C 345 70, 335 82, 332 100 Z" fill="url(#goldBevel)" />
    <circle cx="332" cy="50" r="3.5" fill="url(#goldLight)" />

    <!-- Left Outer Peak -->
    <path d="M 240 102 C 235 90, 222 84, 235 68 C 248 82, 248 92, 252 102 Z" fill="url(#goldLight)" />
    <circle cx="235" cy="66" r="3" fill="url(#goldBevel)" />

    <!-- Right Outer Peak -->
    <path d="M 348 102 C 352 92, 352 82, 365 68 C 378 84, 365 90, 360 102 Z" fill="url(#goldLight)" />
    <circle cx="365" cy="66" r="3" fill="url(#goldBevel)" />

    <!-- Ornate Scroll Ribbons on Crown Base -->
    <path d="M 228 106 Q 218 95 230 88 Q 236 98 244 104" fill="url(#goldLight)" />
    <path d="M 372 106 Q 382 95 370 88 Q 364 98 356 104" fill="url(#goldLight)" />
  </g>

  <!-- ============================================== -->
  <!-- 2. CIRCULAR MEDALLION WITH CRIMSON BROCADE     -->
  <!-- ============================================== -->
  <g id="medallion" filter="url(#shadow3d)">
    <!-- Outer Broad Gold Ring -->
    <circle cx="300" cy="225" r="162" fill="url(#goldBevel)" />
    <circle cx="300" cy="225" r="156" fill="#120406" />
    <circle cx="300" cy="225" r="150" fill="url(#goldLight)" />
    <circle cx="300" cy="225" r="144" fill="#3a060e" />

    <!-- Inner Ruby Red Brocade Field -->
    <circle cx="300" cy="225" r="141" fill="url(#rubyGlow)" />
    <circle cx="300" cy="225" r="141" fill="url(#damaskWeave)" />

    <!-- Delicate Inner Gold Bead Rim -->
    <circle cx="300" cy="225" r="139" fill="none" stroke="url(#goldLight)" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.6" />
  </g>

  <!-- Registered Trademark (R) -->
  <g transform="translate(442, 115)">
    <circle cx="0" cy="0" r="10" fill="none" stroke="url(#goldLight)" stroke-width="1.8" />
    <text x="0" y="4" font-family="Cinzel, serif" font-size="11" font-weight="bold" fill="url(#goldLight)" text-anchor="middle">R</text>
  </g>

  <!-- ============================================== -->
  <!-- 3. CENTRAL MONOGRAM "SRi" (Sculpted 3D Ribbon) -->
  <!-- ============================================== -->
  <g id="monogram" filter="url(#shadow3d)" transform="translate(300, 225)">
    <!-- "S" Master Flourish Swirls -->
    <!-- Top Arc of S -->
    <path d="M 12 -72 C -35 -72, -78 -46, -72 -14 C -68 14, -28 32, -4 48 C 24 64, 38 82, 28 102 C 16 122, -24 126, -58 112 C -68 108, -75 98, -82 90 C -78 104, -64 124, -36 134 C 4 146, 56 136, 72 104 C 88 72, 60 48, 24 30 C -12 12, -48 -2, -48 -26 C -48 -44, -22 -58, 12 -58 C 36 -58, 56 -48, 68 -36 C 68 -48, 52 -65, 34 -70 Z" fill="url(#goldLight)" />
    
    <!-- Inner S Contour Highlight -->
    <path d="M 8 -68 C -30 -68, -66 -46, -62 -18 C -58 8, -24 26, 0 42 C 28 58, 48 78, 38 102 C 28 122, -10 126, -42 115 C -2 120, 30 114, 44 94 C 58 72, 42 54, 14 38 C -22 22, -54 6, -54 -18 C -54 -38, -32 -54, 4 -54 C 28 -54, 46 -46, 56 -36 C 46 -48, 30 -60, 14 -66 Z" fill="url(#goldRadial)" opacity="0.8" />

    <!-- "R" Interlocking Calligraphic Ribbon -->
    <path d="M -8 -45 C 8 -45, 38 -45, 48 -25 C 56 -8, 44 8, 28 14 C 44 26, 62 62, 74 100 L 52 100 C 42 66, 28 34, 12 24 L -4 24 L -4 100 L -22 100 L -22 -45 Z" fill="url(#goldBevel)" />
    <!-- R Inner Bowl Cutout -->
    <path d="M -4 -30 L 14 -30 C 26 -30, 34 -24, 30 -12 C 26 0, 16 6, 2 6 L -4 6 Z" fill="#4d0614" />
    <path d="M -2 -26 L 12 -26 C 20 -26, 26 -22, 24 -14 C 22 -6, 14 -2, 4 -2 L -2 -2 Z" fill="url(#goldLight)" opacity="0.6" />

    <!-- "i" Slender Stem and Diamond Dot -->
    <path d="M 84 -15 L 102 -15 L 102 100 L 84 100 Z" fill="url(#goldLight)" />
    <!-- i Dot (Golden Radiant Jewel) -->
    <circle cx="93" cy="-38" r="13" fill="url(#goldLight)" />
    <circle cx="93" cy="-38" r="8" fill="url(#goldRadial)" />
    <circle cx="91" cy="-40" r="3" fill="#ffffff" />
  </g>

  <!-- ============================================== -->
  <!-- 4. LOWER TITLE "S R I" (3D Sculpted Serif)     -->
  <!-- ============================================== -->
  <g id="titleSRI" filter="url(#shadow3d)">
    <text x="300" y="445" font-family="'Cinzel', 'Cormorant Garamond', 'Georgia', serif" font-size="94" font-weight="800" letter-spacing="18" fill="url(#goldLight)" text-anchor="middle">
      SRI
    </text>
    <!-- Overlay Highlight on Text -->
    <text x="299" y="443" font-family="'Cinzel', 'Cormorant Garamond', 'Georgia', serif" font-size="94" font-weight="800" letter-spacing="18" fill="url(#goldRadial)" text-anchor="middle" opacity="0.6">
      SRI
    </text>
  </g>

  <!-- ============================================== -->
  <!-- 5. TAGLINE & ORNATE DIVIDERS                   -->
  <!-- ============================================== -->
  <g id="tagline" filter="url(#shadow3d)">
    <!-- Flanking Golden Rules -->
    <line x1="60" y1="466" x2="150" y2="466" stroke="url(#goldLight)" stroke-width="1.5" />
    <line x1="450" y1="466" x2="540" y2="466" stroke="url(#goldLight)" stroke-width="1.5" />
    <circle cx="154" cy="466" r="2" fill="url(#goldLight)" />
    <circle cx="446" cy="466" r="2" fill="url(#goldLight)" />

    <!-- Tagline Text -->
    <text x="300" y="471" font-family="'Cinzel', 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="5" fill="url(#goldLight)" text-anchor="middle">
      FABRICS FOR A BRIGHTER TOMORROW
    </text>
  </g>

  <!-- ============================================== -->
  <!-- 6. 4 PILLARS ICON STRIP                         -->
  <!-- ============================================== -->
  <g id="pillars" transform="translate(0, 485)" opacity="0.95">
    <!-- Pillar 1: Fabric Manufacturing (Gear) -->
    <g transform="translate(160, 20)" text-anchor="middle">
      <circle cx="0" cy="0" r="10" fill="none" stroke="url(#goldLight)" stroke-width="1.5" />
      <path d="M -3 -12 L 3 -12 L 2 -9 L -2 -9 Z M 9 -3 L 12 -3 L 12 3 L 9 2 Z M -3 9 L 3 9 L 2 12 L -2 12 Z M -12 -3 L -9 -3 L -9 3 L -12 2 Z" fill="url(#goldLight)" />
      <circle cx="0" cy="0" r="4" fill="url(#goldLight)" />
      <text y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700" letter-spacing="1" fill="url(#goldLight)">FABRIC</text>
      <text y="33" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" font-weight="600" letter-spacing="0.5" fill="#d9a33b">MANUFACTURING</text>
    </g>

    <line x1="210" y1="12" x2="210" y2="46" stroke="url(#goldLight)" stroke-width="1" opacity="0.4" />

    <!-- Pillar 2: Dresses (Gown Silhouette) -->
    <g transform="translate(255, 20)" text-anchor="middle">
      <path d="M -5 -10 L 5 -10 L 3 -2 L 10 12 L -10 12 L -3 -2 Z" fill="url(#goldLight)" />
      <path d="M 0 -2 L 0 12" stroke="#5c3f08" stroke-width="0.8" />
      <text y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" letter-spacing="1" fill="url(#goldLight)">DRESSES</text>
    </g>

    <line x1="300" y1="12" x2="300" y2="46" stroke="url(#goldLight)" stroke-width="1" opacity="0.4" />

    <!-- Pillar 3: Sarees (Draped Fabric Swatch) -->
    <g transform="translate(345, 20)" text-anchor="middle">
      <path d="M -8 -10 L 4 -10 L 9 12 L -3 12 Z" fill="url(#goldLight)" />
      <path d="M -3 -10 L 2 12" stroke="#5c3f08" stroke-width="0.8" />
      <text y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" letter-spacing="1" fill="url(#goldLight)">SAREES</text>
    </g>

    <line x1="390" y1="12" x2="390" y2="46" stroke="url(#goldLight)" stroke-width="1" opacity="0.4" />

    <!-- Pillar 4: Global Reach (Globe with Meridians) -->
    <g transform="translate(440, 20)" text-anchor="middle">
      <circle cx="0" cy="0" r="10" fill="none" stroke="url(#goldLight)" stroke-width="1.4" />
      <ellipse cx="0" cy="0" rx="5" ry="10" fill="none" stroke="url(#goldLight)" stroke-width="1" />
      <line x1="-10" y1="0" x2="10" y2="0" stroke="url(#goldLight)" stroke-width="1" />
      <text y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700" letter-spacing="1" fill="url(#goldLight)">GLOBAL</text>
      <text y="33" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" font-weight="600" letter-spacing="0.5" fill="#d9a33b">REACH</text>
    </g>
  </g>

  <!-- ============================================== -->
  <!-- 7. BOTTOM CURVED PHILOSOPHY BANNER             -->
  <!-- ============================================== -->
  <g id="bottomArc">
    <path id="textArc" d="M 120 540 Q 300 585 480 540" fill="none" />
    <text font-family="'Cinzel', sans-serif" font-size="10" font-weight="700" letter-spacing="6" fill="url(#goldLight)" opacity="0.8">
      <textPath href="#textArc" startOffset="50%" text-anchor="middle">
        TRADITION MEETS INNOVATION
      </textPath>
    </text>
  </g>
</svg>
